<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>명일방주:엔드필드 기질 파밍 도우미</title>
    <link rel="stylesheet" href="style.css?v=1.2">
    <!-- Google Fonts for better typography -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>엔드필드 기질 파밍 효율 계산기</h1>
            <p>파티에 사용하는 무기를 선택하여 가장 효율적인 기질 파밍 지역을 확인하세요.</p>
        </header>

        <section id="weapon-selector">
            <h2>무기 선택</h2>
            
            <div class="selection-summary">
                <p>선택된 무기: <span id="selected-count">0</span>개</p>
                <div id="selected-weapons-display"></div>
            </div>

            <div id="filter-section">
                <input type="text" id="search-input" placeholder="무기 이름 검색...">
                <div id="type-tabs" class="tabs-container">
                    <!-- Tabs will be generated by JS -->
                </div>
            </div>
            
            <div id="weapon-list" class="grid-container">
                <!-- Weapons will be dynamically inserted here -->
            </div>

            <button id="reset-btn" class="secondary-btn">초기화</button>
            <button id="analyze-btn" class="primary-btn" disabled>분석하기</button>
        </section>

        <section id="results-section" class="hidden">
            <h2>분석 결과</h2>
            <div id="results-container">
                <!-- Results will be displayed here -->
            </div>
        </section>
    </div>

    <footer>
        <p>Fan Website for Arknights: Endfield</p>
    </footer>

    <script src="script.js?v=1.2"></script>
</body>
</html>
